<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل بلاغ أو عطل في المركبة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #F5F5F5;
            padding: 16px;
            direction: rtl;
        }
        .card-section {
            background-color: #FFFFFF;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            margin: 0 auto;
        }
        .title-header {
            color: #1A237E;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333333;
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #CCCCCC;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-control:focus {
            border-color: #1A237E;
        }
        textarea.form-control {
            height: 120px;
            resize: vertical;
        }
        .btn-outline {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #1A237E;
            color: #1A237E;
            background: transparent;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-outline:active {
            background-color: rgba(26, 35, 126, 0.05);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #1A237E;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-primary:active {
            background-color: #0D1668;
        }
    </style>
</head>
<body>

    <div id="file1-fault-report" class="card-section">
        <h2 class="title-header">
            تسجيل بلاغ أو عطل في المركبة
        </h2>

        <!-- نوع البلاغ -->
        <div class="form-group">
            <label for="etReportType">نوع البلاغ</label>
            <input type="text" id="etReportType" class="form-control" placeholder="أدخل نوع البلاغ" />
        </div>

        <!-- وصف التفاصيل أو العطل -->
        <div class="form-group">
            <label for="etDescription">وصف التفاصيل أو العطل بالتفصيل</label>
            <textarea id="etDescription" class="form-control" rows="4" placeholder="اكتب التفاصيل هنا..."></textarea>
        </div>

        <!-- زر التقاط صورة للعطل -->
        <button id="btnAttachPhoto" class="btn-outline">
            📷 التقاط صورة للعطل / المشكلة
        </button>

        <!-- زر إرسال البلاغ -->
        <button id="btnSubmitReport" class="btn-primary">
            إرسال البلاغ وحفظه محلياً
        </button>
    </div>

</body>
</html>
