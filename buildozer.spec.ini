[app]

# (str) Title of your application
title = Fleet Control 2600

# (str) Package name
package.name = fleet2600

# (str) Package domain (needed for android packaging)
package.domain = com.fleet.app

# (str) Source code where the main.py live
source.dir = .

# (list) Source files to include (let empty to include all the files)
source.include_exts = py,png,jpg,kv,atlas,json

# (str) Application versioning
version = 1.0.0

# (list) Application requirements
# تشمل الحزم الأساسية والربط السحابي والصوت
requirements = python3,kivy,requests,urllib3,pyaudio,firebase-admin

# (list) Permissions
# الأذونات المطلوبة للصوت والإنترنت والوصول للملفات
android.permissions = INTERNET, RECORD_AUDIO, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE

# (int) Target Android API
android.api = 33

# (int) Minimum API supported
android.minapi = 21

# (str) Orientation (landscape, sensorLandscape, portrait or all)
orientation = portrait

[buildozer]

# (int) Log level (0 = error only, 1 = info, 2 = debug (with command output))
log_level = 2